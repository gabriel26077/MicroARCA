name: micro_arca_app
description: "Editor MicroPython para kits ARCA por Bluetooth BLE no Android."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  code_text_field: ^1.1.0 
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0
  flutter_reactive_ble: ^5.5.0
  crypto: ^3.0.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
