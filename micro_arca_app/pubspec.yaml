name: micro_arca_app
description: "Editor MicroPython para kits ARCA por Bluetooth BLE no Android."
publish_to: 'none'
version: 1.1.1+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  code_text_field: ^1.1.0 
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0
  flutter_reactive_ble: ^5.5.0
  crypto: ^3.0.6
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/blockly/
    - assets/blockly/media/
  fonts:
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
