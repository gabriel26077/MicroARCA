<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Blocos MicroARCA</title>
    <style>
      html,
      body,
      #workspace {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f4fafb;
        touch-action: none;
      }

      /* The assignment arrow reads as a symbol, not as a word. */
      .blocklyText.microarcaArrow {
        font-size: 26px !important;
        font-weight: 700;
      }

      .blocklyText,
      .blocklyHtmlInput {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif !important;
      }

      /* Blockly's dropdowns target a mouse by default. Variable actions need
         comfortable touch rows and readable labels on a phone. */
      body .blocklyDropDownDiv {
        border-radius: 10px !important;
        padding: 6px !important;
        max-width: calc(100vw - 24px);
      }

      body .blocklyDropDownDiv .blocklyMenu {
        min-width: 230px;
        font-size: 17px !important;
        padding: 4px 0 !important;
      }

      body .blocklyDropDownDiv .blocklyMenuItem {
        box-sizing: border-box;
        min-height: 48px;
        padding: 12px 18px 12px 40px !important;
        display: flex;
        align-items: center;
        touch-action: manipulation;
      }

      body .blocklyDropDownDiv .blocklyMenuItemContent {
        font-size: 17px !important;
        line-height: 24px;
      }

      /* Blockly only lets the canvas be dragged when scrollbars exist; they
         stay hidden because the gesture is dragging with a finger. */
      .blocklyScrollbarHorizontal,
      .blocklyScrollbarVertical {
        display: none;
      }
      :root { --workspace: #f4fafb; --panel: #ffffff; --ink: #183f46; }
      body.dark { --workspace: #182227; --panel: #253238; --ink: #e0f2f1; }
      html, body, #workspace { background: var(--workspace); }
      #drag-loupe {
        position: fixed; top: 84px; right: 12px; width: 200px;
        border: 2px solid #00a9bd; border-radius: 14px; overflow: hidden;
        background: var(--workspace); color: var(--ink);
        box-shadow: 0 4px 16px #0005; z-index: 100; pointer-events: none;
      }
      #drag-loupe[hidden] { display: none; }
      #drag-loupe .caption {
        padding: 5px 8px; background: var(--panel);
        font: 600 12px system-ui, sans-serif;
      }
      #drag-loupe .view { position: relative; height: 132px; }
      #drag-loupe svg { display: block; }
      #drag-loupe .aim {
        position: absolute; left: 50%; top: 50%; width: 22px; height: 22px;
        transform: translate(-50%, -50%); border: 2px solid #00cfe8;
        border-radius: 50%; box-shadow: 0 0 0 2px #0005;
      }
    </style>
  </head>
  <body>
    <div id="workspace" aria-label="Editor de blocos MicroARCA"></div>
    <div id="drag-loupe" hidden aria-hidden="true">
      <div class="caption">Arraste para encaixar · 2×</div>
      <div class="view"><div class="aim"></div></div>
    </div>
    <script src="blockly_compressed.js"></script>
    <script src="blocks_compressed.js"></script>
    <script src="python_compressed.js"></script>
    <script src="pt-br.js"></script>
    <script src="io_blocks.js"></script>
    <script>
      "use strict";

      Blockly.defineBlocksWithJsonArray([
        {
          type: "microarca_while",
          message0: "repetir enquanto %1",
          args0: [{ type: "input_value", name: "BOOL", check: "Boolean" }],
          message1: "fazer %1",
          args1: [{ type: "input_statement", name: "DO" }],
          previousStatement: null,
          nextStatement: null,
          style: "microarca_loop_blocks",
          tooltip: "Verifica a condição antes de cada repetição. Quando ela for falsa, continua nos próximos blocos.",
          helpUrl: "",
        },
        {
          type: "microarca_forever",
          message0: "repetir para sempre %1 %2",
          args0: [
            { type: "input_dummy" },
            { type: "input_statement", name: "DO" },
          ],
          previousStatement: null,
          style: "microarca_loop_blocks",
          tooltip: "Repete os blocos internos enquanto o ESP32 estiver ligado.",
          helpUrl: "",
        },
        {
          type: "microarca_pin_mode",
          message0: "configurar pino %1 como %2",
          args0: [
            {
              type: "input_value",
              name: "PIN",
              check: "Number",
            },
            {
              type: "field_dropdown",
              name: "MODE",
              options: [
                ["saída", "OUT"],
                ["entrada", "IN"],
                ["entrada pull-up", "PULL_UP"],
              ],
            },
          ],
          previousStatement: null,
          nextStatement: null,
          style: "microarca_io_blocks",
          tooltip: "Configura diretamente o modo de um pino GPIO.",
          helpUrl: "",
        },
        {
          type: "microarca_pin_write",
          message0: "escrever no pino %1 nível %2",
          args0: [
            {
              type: "input_value",
              name: "PIN",
              check: "Number",
            },
            {
              type: "input_value",
              name: "LEVEL",
              check: "Boolean",
            },
          ],
          previousStatement: null,
          nextStatement: null,
          style: "microarca_io_blocks",
          tooltip: "Escreve nível lógico alto ou baixo em um pino configurado.",
          helpUrl: "",
        },
        {
          type: "microarca_wait",
          message0: "esperar %1 segundos",
          args0: [
            {
              type: "input_value",
              name: "SECONDS",
              check: "Number",
            },
          ],
          previousStatement: null,
          nextStatement: null,
          style: "microarca_time_blocks",
          tooltip: "Pausa o programa durante o tempo informado.",
          helpUrl: "",
        },
        {
          type: "microarca_logic_level",
          message0: "%1",
          args0: [
            {
              type: "field_dropdown",
              name: "LEVEL",
              options: [
                ["ALTO", "HIGH"],
                ["BAIXO", "LOW"],
              ],
            },
          ],
          output: "Boolean",
          style: "logic_blocks",
          tooltip: "Cria um valor lógico ALTO ou BAIXO.",
          helpUrl: "",
        },
        {
          // Keep Blockly's persisted type while making the accepted values
          // explicit: MicroPython's print handles every MicroARCA base type.
          type: "text_print",
          message0: "exibir no console %1",
          args0: [
            {
              type: "input_value",
              name: "TEXT",
              check: ["String", "Number", "Boolean"],
            },
          ],
          previousStatement: null,
          nextStatement: null,
          style: "text_blocks",
          tooltip: "Exibe texto, número ou valor lógico no console.",
          helpUrl: "",
        },
        {
          type: "microarca_console_input",
          message0: "ler resposta no console %1",
          args0: [{ type: "input_value", name: "PROMPT", check: "String" }],
          output: "String",
          style: "text_blocks",
          tooltip: "Mostra uma pergunta no console e aguarda uma resposta pelo celular.",
          helpUrl: "",
        },
        {
          type: "microarca_text_join",
          message0: "juntar %1 com %2",
          args0: [
            {
              type: "input_value",
              name: "A",
              check: ["String", "Number", "Boolean"],
            },
            {
              type: "input_value",
              name: "B",
              check: ["String", "Number", "Boolean"],
            },
          ],
          inputsInline: true,
          output: "String",
          style: "text_blocks",
          tooltip: "Junta dois valores, convertendo números e lógicos em texto.",
          helpUrl: "",
        },
        {
          type: "microarca_variable_change",
          message0: "somar %1 a %2",
          args0: [
            {
              type: "input_value",
              name: "DELTA",
              check: "Number",
            },
            {
              type: "field_variable",
              name: "VAR",
              variable: "contador",
              variableTypes: ["Number"],
              defaultType: "Number",
            },
          ],
          inputsInline: true,
          previousStatement: null,
          nextStatement: null,
          style: "variable_dynamic_blocks",
          tooltip: "Soma um número à variável.",
          helpUrl: "",
        },
        {
          // Replaces Blockly's "definir x para": one block both creates the
          // variable and changes its value, as `x = valor` does in Python.
          type: "variables_set_dynamic",
          message0: "%1 %2 %3",
          args0: [
            { type: "field_variable", name: "VAR", variable: "x" },
            { type: "field_label", text: "←", class: "microarcaArrow" },
            { type: "input_value", name: "VALUE" },
          ],
          inputsInline: true,
          previousStatement: null,
          nextStatement: null,
          style: "variable_dynamic_blocks",
          tooltip:
            "Declarar/atribuir: guarda o valor na variável. Se ela ainda não existe, é criada.",
          helpUrl: "",
          extensions: ["contextMenu_variableDynamicSetterGetter"],
        },
        {
          type: "microarca_function_def",
          message0: "definir função %1 %2",
          args0: [
            {
              type: "field_input",
              name: "NAME",
              text: "minha_funcao",
            },
            { type: "input_statement", name: "BODY" },
          ],
          style: "microarca_function_blocks",
          tooltip: "Cria uma função com o nome escolhido.",
          helpUrl: "",
        },
        {
          type: "microarca_function_call",
          message0: "chamar função %1",
          args0: [
            {
              type: "field_input",
              name: "NAME",
              text: "minha_funcao",
            },
          ],
          previousStatement: null,
          nextStatement: null,
          style: "microarca_function_blocks",
          tooltip: "Executa uma função definida no programa.",
          helpUrl: "",
        },
      ]);

      const pythonGenerator = python.pythonGenerator;

      pythonGenerator.forBlock.microarca_while = function (block, generator) {
        const condition = generator.valueToCode(block, "BOOL", python.Order.NONE) || "False";
        const body = generator.statementToCode(block, "DO") || generator.PASS;
        return `while ${condition}:\n${body}`;
      };

      pythonGenerator.forBlock.microarca_forever = function (block, generator) {
        const body = generator.statementToCode(block, "DO") || generator.PASS;
        return `while True:\n${body}`;
      };

      function inputCode(block, inputName, generator, fallback) {
        return generator.valueToCode(block, inputName, python.Order.NONE) || fallback;
      }

      MicroArcaIO.install(Blockly, python);

      pythonGenerator.forBlock.microarca_wait = function (block, generator) {
        const seconds = inputCode(block, "SECONDS", generator, "1");
        generator.definitions_.microarca_import_time = "import time";
        return `time.sleep(max(0, min(3600, float(${seconds}))))\n`;
      };

      pythonGenerator.forBlock.microarca_logic_level = function (block) {
        return [
          block.getFieldValue("LEVEL") === "HIGH" ? "True" : "False",
          python.Order.ATOMIC,
        ];
      };

      pythonGenerator.forBlock.microarca_text_join = function (block, generator) {
        const left = inputCode(block, "A", generator, "''");
        const right = inputCode(block, "B", generator, "''");
        return [`str(${left}) + str(${right})`, python.Order.ADDITIVE];
      };

      pythonGenerator.forBlock.microarca_console_input = function (block, generator) {
        const prompt = inputCode(block, "PROMPT", generator, "''");
        return [`input(${prompt})`, python.Order.FUNCTION_CALL];
      };

      pythonGenerator.forBlock.microarca_variable_change = function (
        block,
        generator,
      ) {
        const variable = generator.getVariableName(block.getFieldValue("VAR"));
        const delta = inputCode(block, "DELTA", generator, "1");
        return (
          `${variable} = (${variable} if isinstance(${variable}, ` +
          `(int, float)) else 0) + ${delta}\n`
        );
      };

      const pythonKeywords = new Set([
        "False", "None", "True", "and", "as", "assert", "async", "await",
        "break", "class", "continue", "def", "del", "elif", "else", "except",
        "finally", "for", "from", "global", "if", "import", "in", "is",
        "lambda", "nonlocal", "not", "or", "pass", "raise", "return", "try",
        "while", "with", "yield",
      ]);

      const coreBlockTypes = new Set([
        ...MicroArcaIO.types,
        "microarca_forever",
        "microarca_while",
        "microarca_pin_mode",
        "microarca_pin_write",
        "microarca_wait",
        "microarca_logic_level",
        "microarca_variable_change",
        "microarca_function_def",
        "microarca_function_call",
        "variables_set_dynamic",
        "variables_get_dynamic",
        "math_number",
        "math_arithmetic",
        "text",
        "text_print",
        "microarca_console_input",
        "microarca_text_join",
        "controls_if",
        "controls_ifelse",
        "logic_compare",
        "logic_operation",
        "logic_negate",
      ]);
      const variableBlockTypes = new Set([
        "variables_set_dynamic",
        "variables_get_dynamic",
        "microarca_variable_change",
      ]);
      const libraryBlockPackages = new Map();
      const libraryBlockDefinitions = new Map();

      function pythonIdentifier(rawName, fallback) {
        let name = String(rawName || fallback)
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^A-Za-z0-9_]/g, "_");
        if (!/^[A-Za-z_]/.test(name)) name = `${fallback}_${name}`;
        if (!name) name = fallback;
        if (pythonKeywords.has(name)) name = `${fallback}_${name}`;
        return name;
      }

      function functionName(rawName) {
        return pythonIdentifier(rawName, "funcao");
      }

      pythonGenerator.forBlock.microarca_function_def = function (block, generator) {
        const name = functionName(block.getFieldValue("NAME"));
        const body = generator.statementToCode(block, "BODY") || generator.PASS;
        generator.definitions_[`%${name}`] = `def ${name}():\n${body}`;
        return null;
      };

      pythonGenerator.forBlock.microarca_function_call = function (block) {
        return `${functionName(block.getFieldValue("NAME"))}()\n`;
      };

      function registerLibraryManifests(manifests) {
        if (!Array.isArray(manifests)) return;
        for (const manifest of manifests) {
          const packageId = manifest?.package?.id;
          const packageVersion = manifest?.package?.version;
          const category = manifest?.category;
          if (
            typeof packageId !== "string" ||
            typeof packageVersion !== "string" ||
            typeof category?.color !== "string" ||
            !Array.isArray(manifest.blocks)
          ) {
            continue;
          }
          const packageKey = `${packageId}@${packageVersion}`;
          for (const definition of manifest.blocks) {
            if (
              typeof definition?.type !== "string" ||
              coreBlockTypes.has(definition.type) ||
              libraryBlockPackages.has(definition.type) ||
              !Array.isArray(definition.fields)
            ) {
              continue;
            }
            const fields = new Map(
              definition.fields.map((field) => [field.name, field]),
            );
            const fieldArg = (field) => {
              if (field.type === "dropdown") {
                return {
                  type: "field_dropdown", name: field.name,
                  options: field.options,
                };
              }
              if (field.type === "identifier") {
                return {
                  type: "field_input",
                  name: field.name,
                  text: String(field.default),
                };
              }
              if (field.type === "integer") {
                return {
                  type: "input_value",
                  name: field.name,
                  check: "Number",
                };
              }
              if (field.type === "value") {
                return {
                  type: "input_value",
                  name: field.name,
                  check: ["String", "Number", "Boolean"],
                };
              }
              return {
                type: "input_value",
                name: field.name,
                check: "String",
              };
            };
            // Inputs sit inline, and each coordinate pair (a field named X,
            // X1, X2...) starts a new row together with its two leading words,
            // so "de x 0 y 0" and "até x 40 y 20" read as units instead of
            // one input per row.
            const parts = definition.label.split(/\{([A-Z][A-Z0-9_]*)\}/);
            const args0 = [];
            let message0 = "";
            for (let index = 1; index < parts.length; index += 2) {
              const field = fields.get(parts[index]);
              if (!field) continue;
              let text = parts[index - 1];
              if (/^X[0-9]*$/.test(field.name) && args0.length > 0) {
                const words = text.trim().split(/\s+/);
                const kept = words.slice(0, -2).join(" ");
                args0.push({ type: "input_end_row" });
                message0 += ` ${kept} %${args0.length} `;
                text = words.slice(-2).join(" ") + " ";
              }
              args0.push(fieldArg(field));
              message0 += `${text}%${args0.length}`;
            }
            message0 += parts[parts.length - 1];
            Blockly.defineBlocksWithJsonArray([
              {
                type: definition.type,
                message0,
                args0,
                inputsInline: true,
                previousStatement: null,
                nextStatement: null,
                colour: category.color,
                tooltip: definition.description,
                helpUrl: "",
              },
            ]);
            pythonGenerator.forBlock[definition.type] = function (block, generator) {
              for (const [index, importLine] of definition.python.imports.entries()) {
                generator.definitions_[
                  `library_${definition.type}_${index}`
                ] = importLine;
              }
              return definition.python.template.replace(
                /\{([A-Z][A-Z0-9_]*)\}/g,
                (_, name) => {
                  const field = fields.get(name);
                  if (field.type === "dropdown") {
                    const selected = block.getFieldValue(name);
                    const allowed = field.options.some((option) => option[1] === selected);
                    return generator.quote_(allowed ? selected : field.default);
                  }
                  if (field.type === "identifier") {
                    return pythonIdentifier(block.getFieldValue(name), "objeto");
                  }
                  if (field.type === "text") {
                    return inputCode(
                      block,
                      name,
                      generator,
                      JSON.stringify(String(field.default ?? "")),
                    );
                  }
                  if (field.type === "value") {
                    let fallback = JSON.stringify(field.default ?? "");
                    if (field.default === true) fallback = "True";
                    if (field.default === false) fallback = "False";
                    return inputCode(block, name, generator, fallback);
                  }
                  const value = inputCode(
                    block,
                    name,
                    generator,
                    String(Number(field.default)),
                  );
                  return `max(${Number(field.min)}, min(${Number(field.max)}, int(${value})))`;
                },
              );
            };
            libraryBlockPackages.set(definition.type, packageKey);
            libraryBlockDefinitions.set(definition.type, definition);
          }
        }
      }

      const theme = Blockly.Theme.defineTheme("microarca", {
        base: Blockly.Themes.Classic,
        blockStyles: {
          microarca_loop_blocks: {
            colourPrimary: "#1565c0",
            colourSecondary: "#0d47a1",
            colourTertiary: "#08306b",
          },
          microarca_io_blocks: {
            colourPrimary: "#00a9bd",
            colourSecondary: "#007f8f",
            colourTertiary: "#005a66",
          },
          microarca_time_blocks: {
            colourPrimary: "#7b61c9",
            colourSecondary: "#5e45a8",
            colourTertiary: "#433181",
          },
          microarca_function_blocks: {
            colourPrimary: "#d06b22",
            colourSecondary: "#aa4e12",
            colourTertiary: "#7b3508",
          },
        },
        componentStyles: {
          workspaceBackgroundColour: "#f4fafb",
          toolboxBackgroundColour: "#eaf9fb",
          toolboxForegroundColour: "#183f46",
          flyoutBackgroundColour: "#eaf9fb",
          flyoutForegroundColour: "#183f46",
          flyoutOpacity: 1,
          scrollbarColour: "#8fcbd3",
          insertionMarkerColour: "#00cfe8",
          insertionMarkerOpacity: 0.35,
          cursorColour: "#00a9bd",
        },
        fontStyle: {
          family: "system-ui, sans-serif",
          weight: "600",
          size: 13,
        },
        startHats: true,
      });

      const workspace = Blockly.inject("workspace", {
        theme,
        renderer: "zelos",
        media: "media/",
        trashcan: false,
        sounds: false,
        move: {
          // Blockly 13 força drag=false quando scrollbars=false.
          scrollbars: true,
          drag: true,
          wheel: true,
        },
        zoom: {
          controls: false,
          wheel: true,
          startScale: 0.86,
          maxScale: 1.5,
          minScale: 0.45,
          scaleSpeed: 1.15,
          // Pinch is handled below, see "Two-finger pinch".
          pinch: false,
        },
      });

      function post(message) {
        if (window.MicroArcaBlocks && window.MicroArcaBlocks.postMessage) {
          window.MicroArcaBlocks.postMessage(JSON.stringify(message));
        }
      }

      const darkTheme = Blockly.Theme.defineTheme("microarca-dark", {
        base: theme,
        componentStyles: {
          workspaceBackgroundColour: "#182227",
          toolboxBackgroundColour: "#253238",
          toolboxForegroundColour: "#e0f2f1",
          flyoutBackgroundColour: "#253238",
          flyoutForegroundColour: "#e0f2f1",
          flyoutOpacity: 1,
          scrollbarColour: "#607d8b",
          insertionMarkerColour: "#00e5ff",
          insertionMarkerOpacity: 0.5,
          cursorColour: "#00e5ff",
        },
      });

      function setDarkMode(dark) {
        document.body.classList.toggle("dark", Boolean(dark));
        workspace.setTheme(dark ? darkTheme : theme);
      }

      // A lupa replica o SVG sem alterar escala, posições ou conexões reais.
      // O destaque vem do próprio Blockly, que decide o encaixe compatível.
      const loupe = document.getElementById("drag-loupe");
      const loupeView = loupe.querySelector(".view");
      let dragActive = false;
      let loupeEnabled = true;
      let loupeFrame = null;
      let lastLoupeTime = 0;
      let dragPointer = null;

      function setLoupeEnabled(enabled) {
        loupeEnabled = Boolean(enabled);
        if (!loupeEnabled) hideLoupe();
      }

      function hideLoupe() {
        dragActive = false;
        loupe.hidden = true;
        if (loupeFrame !== null) cancelAnimationFrame(loupeFrame);
        loupeFrame = null;
        loupeView.querySelector("svg")?.remove();
      }

      function drawLoupe(time) {
        if (!dragActive || !loupeEnabled) return;
        loupeFrame = requestAnimationFrame(drawLoupe);
        // Limita cópias do SVG para preservar fluidez em projetos maiores.
        if (time - lastLoupeTime < 66 || !dragPointer) return;
        lastLoupeTime = time;
        const original = workspace.getParentSvg();
        const highlight = original.querySelector(
          ".blocklyHighlightedConnectionPathVisible",
        );
        const box = highlight?.getBoundingClientRect();
        const focus = box && box.width + box.height > 0
          ? { x: box.left + box.width / 2, y: box.top + box.height / 2 }
          : dragPointer;
        const matrix = original.getScreenCTM();
        if (!matrix) return;
        const point = new DOMPoint(focus.x, focus.y).matrixTransform(matrix.inverse());
        const clone = original.cloneNode(true);
        clone.classList.add(...[...original.parentElement.classList].filter(
          name => name.endsWith('-renderer') || name.endsWith('-theme'),
        ));
        // O bloco arrastado fica em outro SVG; inclui sua camada na mesma
        // coordenada da cena para mostrar o bloco chegando ao encaixe.
        const surface = original.parentElement.querySelector('.blocklyBlockDragSurface');
        const surfaceMatrix = surface?.getScreenCTM();
        if (surfaceMatrix) {
          const relative = matrix.inverse().multiply(surfaceMatrix);
          const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          group.setAttribute('transform', `matrix(${relative.a} ${relative.b} ${relative.c} ${relative.d} ${relative.e} ${relative.f})`);
          for (const child of surface.children) group.append(child.cloneNode(true));
          clone.append(group);
        }
        // IDs próprios evitam colisão com o workspace interativo.
        const ids = new Map();
        for (const node of clone.querySelectorAll("[id]")) {
          ids.set(node.id, `loupe-${node.id}`);
          node.id = ids.get(node.id);
        }
        for (const node of [clone, ...clone.querySelectorAll("*")]) {
          node.removeAttribute("data-id");
          for (const attribute of [...node.attributes]) {
            if (attribute.value.includes("url(#")) {
              node.setAttribute(attribute.name, attribute.value.replace(
                /url\(#([^)]*)\)/g, (match, id) => `url(#${ids.get(id) || id})`,
              ));
            }
          }
        }
        clone.setAttribute("width", "200");
        clone.setAttribute("height", "132");
        clone.setAttribute("viewBox", `${point.x - 50} ${point.y - 33} 100 66`);
        clone.style.width = "200px";
        clone.style.height = "132px";
        clone.style.position = "static";
        loupeView.querySelector("svg")?.remove();
        loupeView.prepend(clone);
        loupe.querySelector(".caption").textContent = highlight
          ? "Encaixe destacado · 2×" : "Arraste para encaixar · 2×";
        // Mant?m a lupa longe do dedo, inclusive na parte superior da tela.
        loupe.style.right = dragPointer.x > innerWidth / 2 ? "auto" : "12px";
        loupe.style.left = dragPointer.x > innerWidth / 2 ? "12px" : "auto";
        loupe.hidden = false;
      }

      document.addEventListener("pointerdown", (event) => {
        if (!event.isPrimary) { hideLoupe(); return; }
        dragPointer = { x: event.clientX, y: event.clientY };
      }, true);
      document.addEventListener("pointermove", (event) => {
        if (event.isPrimary) dragPointer = { x: event.clientX, y: event.clientY };
      }, true);
      for (const type of ["pointerup", "pointercancel"]) {
        document.addEventListener(type, hideLoupe, true);
      }
      window.addEventListener("blur", hideLoupe);

      function handleBlockDrag(event) {
        if (event?.type !== Blockly.Events.BLOCK_DRAG) return;
        if (!event.isStart) { hideLoupe(); return; }
        cancelLongPress();
        if (!loupeEnabled) return;
        dragActive = true;
        if (loupeFrame === null) loupeFrame = requestAnimationFrame(drawLoupe);
      }

      // On touch devices Blockly edits text and number fields through
      // window.prompt, which the WebView renders as a bare system box. Route
      // it to a Flutter dialog instead, remembering which field asked so the
      // app can offer a numeric keyboard.
      const pendingPrompts = new Map();
      let promptSerial = 0;
      let promptField = null;
      const FieldInput = Object.getPrototypeOf(Blockly.FieldTextInput.prototype);
      const showPromptEditor = FieldInput.showPromptEditor;
      FieldInput.showPromptEditor = function () {
        promptField = this;
        try {
          showPromptEditor.call(this);
        } finally {
          promptField = null;
        }
      };

      Blockly.dialog.setPrompt((message, defaultValue, callback) => {
        const id = `prompt-${++promptSerial}`;
        pendingPrompts.set(id, callback);
        post({
          type: "prompt",
          id,
          message: String(message || "").replace(/:\s*$/, ""),
          defaultValue: String(defaultValue ?? ""),
          numeric: promptField instanceof Blockly.FieldNumber,
        });
      });

      function resolvePrompt(id, value) {
        const callback = pendingPrompts.get(id);
        if (!callback) return;
        pendingPrompts.delete(id);
        callback(typeof value === "string" ? value : null);
      }

      // Holding a block still for this long opens its actions (copy,
      // duplicate, delete). Blockly's own long-press menu is disabled.
      const LONG_PRESS_MS = 750;
      const LONG_PRESS_SLOP_PX = 10;
      const DUPLICATE_OFFSET = 32;
      // Same reason Blockly's own "Desabilitar bloco" uses, so projects stay
      // compatible with its serialization and generator.
      const MANUALLY_DISABLED = "MANUALLY_DISABLED";
      let longPress = null;

      Blockly.BlockSvg.prototype.showContextMenu = function () {};
      // The canvas menu offers "Deletar N blocos" on a stray long press;
      // undo and redo already live in the app's own menu.
      Blockly.WorkspaceSvg.prototype.showContextMenu = function () {};

      function cancelLongPress() {
        if (!longPress) return;
        window.clearTimeout(longPress.timer);
        longPress = null;
      }

      function blockUnderPointer(target) {
        const element = target instanceof Element ? target : null;
        const root = element?.closest("[data-id]");
        let block = root ? workspace.getBlockById(root.dataset.id) : null;
        while (block && block.isShadow()) block = block.getParent();
        return block;
      }

      function fireLongPress() {
        const blockId = longPress?.blockId;
        longPress = null;
        const block = blockId ? workspace.getBlockById(blockId) : null;
        if (!block || block.isDisposed()) return;
        workspace.cancelCurrentGesture();
        Blockly.getFocusManager().focusNode(block);
        let chainLength = 0;
        for (let current = block; current; current = current.getNextBlock()) {
          chainLength++;
        }
        post({
          type: "blockActions",
          blockId,
          chainLength,
          disabled: block.hasDisabledReason(MANUALLY_DISABLED),
        });
      }

      const workspaceElement = document.getElementById("workspace");
      workspaceElement.addEventListener(
        "pointerdown",
        (event) => {
          // A second finger means pinch or pan, never a long press.
          if (longPress || !event.isPrimary || event.button > 0) {
            cancelLongPress();
            return;
          }
          const block = blockUnderPointer(event.target);
          if (!block) return;
          longPress = {
            blockId: block.id,
            pointerId: event.pointerId,
            x: event.clientX,
            y: event.clientY,
            timer: window.setTimeout(fireLongPress, LONG_PRESS_MS),
          };
        },
        true,
      );
      document.addEventListener(
        "pointermove",
        (event) => {
          if (!longPress || event.pointerId !== longPress.pointerId) return;
          const distance = Math.hypot(
            event.clientX - longPress.x,
            event.clientY - longPress.y,
          );
          if (distance > LONG_PRESS_SLOP_PX) cancelLongPress();
        },
        true,
      );
      for (const type of ["pointerup", "pointercancel"]) {
        document.addEventListener(type, cancelLongPress, true);
      }

      // Two-finger pinch. Once one finger has moved, Blockly is already
      // dragging the canvas and ignores the second finger, so the canvas jumps
      // instead of zooming. The second finger therefore cancels Blockly's
      // gesture and both fingers are handled here: their distance sets the
      // scale and their midpoint pans. Blockly never sees these events.
      const touches = new Map();
      let pinch = null;

      function touchMidpoint() {
        const [a, b] = [...touches.values()];
        return {
          x: (a.x + b.x) / 2,
          y: (a.y + b.y) / 2,
          distance: Math.hypot(a.x - b.x, a.y - b.y),
        };
      }

      function onPinchDown(event) {
        if (event.pointerType !== "touch") return;
        touches.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (touches.size !== 2 || pinch) return;
        cancelLongPress();
        workspace.cancelCurrentGesture();
        const start = touchMidpoint();
        pinch = {
          distance: Math.max(start.distance, 1),
          scale: workspace.scale,
          x: start.x,
          y: start.y,
        };
        event.stopImmediatePropagation();
        event.preventDefault();
      }

      function onPinchMove(event) {
        if (!touches.has(event.pointerId)) return;
        touches.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (!pinch) return;
        event.stopImmediatePropagation();
        event.preventDefault();
        if (touches.size < 2) return;
        const now = touchMidpoint();
        const options = workspace.options.zoomOptions;
        const target = Math.min(
          options.maxScale,
          Math.max(options.minScale, (pinch.scale * now.distance) / pinch.distance),
        );
        const rect = workspace.getInjectionDiv().getBoundingClientRect();
        if (Math.abs(target - workspace.scale) > 0.001) {
          // zoom() keeps the point under the fingers still.
          workspace.zoom(
            now.x - rect.left,
            now.y - rect.top,
            Math.log(target / workspace.scale) / Math.log(options.scaleSpeed),
          );
        }
        workspace.scroll(
          workspace.scrollX + now.x - pinch.x,
          workspace.scrollY + now.y - pinch.y,
        );
        pinch.x = now.x;
        pinch.y = now.y;
      }

      function onPinchUp(event) {
        if (!touches.delete(event.pointerId)) return;
        if (!pinch) return;
        event.stopImmediatePropagation();
        // The finger left on the screen stays out of Blockly until it lifts.
        if (touches.size === 0) pinch = null;
      }

      window.addEventListener("pointerdown", onPinchDown, true);
      window.addEventListener("pointermove", onPinchMove, true);
      window.addEventListener("pointerup", onPinchUp, true);
      window.addEventListener("pointercancel", onPinchUp, true);

      // A disabled block and the blocks nested inside it generate no code;
      // the blocks below it in the stack keep running.
      function setBlockDisabled(blockId, disabled) {
        const block = workspace.getBlockById(blockId);
        if (!block || block.isDisposed()) {
          post({ type: "error", message: "O bloco não existe mais." });
          return;
        }
        Blockly.Events.setGroup(true);
        try {
          block.setDisabledReason(Boolean(disabled), MANUALLY_DISABLED);
        } finally {
          Blockly.Events.setGroup(false);
        }
        emitState();
      }

      function duplicateBlock(blockId, withChain) {
        const block = workspace.getBlockById(blockId);
        if (!block || block.isDisposed()) {
          post({ type: "error", message: "O bloco não existe mais." });
          return;
        }
        const state = Blockly.serialization.blocks.save(block, {
          addCoordinates: false,
          addNextBlocks: Boolean(withChain),
          saveIds: false,
        });
        const origin = block.getRelativeToSurfaceXY();
        state.x = origin.x + DUPLICATE_OFFSET;
        state.y = origin.y + DUPLICATE_OFFSET;
        Blockly.Events.setGroup(true);
        try {
          const copy = Blockly.serialization.blocks.append(state, workspace);
          Blockly.getFocusManager().focusNode(copy);
        } finally {
          Blockly.Events.setGroup(false);
        }
        emitState();
      }

      function checkedBlock(blockId) {
        const block = workspace.getBlockById(blockId);
        if (!block || block.isDisposed()) {
          post({ type: "error", message: "O bloco não existe mais." });
          return null;
        }
        return block;
      }

      // The copy is the block with what is nested inside it, like "Duplicar
      // bloco". Flutter keeps it, so it can be pasted in another project.
      function copyBlock(blockId) {
        const block = checkedBlock(blockId);
        if (!block) return;
        const state = Blockly.serialization.blocks.save(block, {
          addCoordinates: false,
          addNextBlocks: false,
          saveIds: false,
        });
        post({
          type: "copied",
          state: JSON.stringify(state),
          label: block.toString(40),
        });
      }

      let pasteSerial = 0;

      // Each paste lands a little lower and to the right, near the top-left
      // of what is on screen, so repeated pastes do not stack on each other.
      function pasteBlock(encoded) {
        let state;
        try {
          state = JSON.parse(String(encoded));
        } catch (_) {
          post({ type: "error", message: "Cópia inválida." });
          return;
        }
        const view = workspace.getMetricsManager().getViewMetrics(true);
        const offset = (pasteSerial++ % 6) * DUPLICATE_OFFSET;
        state.x = view.left + view.width * 0.15 + offset;
        state.y = view.top + view.height * 0.3 + offset;
        Blockly.Events.setGroup(true);
        try {
          const copy = Blockly.serialization.blocks.append(state, workspace);
          Blockly.getFocusManager().focusNode(copy);
        } catch (error) {
          post({
            type: "error",
            message: "Este projeto não tem esse tipo de bloco: " + error,
          });
          return;
        } finally {
          Blockly.Events.setGroup(false);
        }
        emitState();
      }

      // withChain also removes every block below; otherwise the blocks below
      // move up to take its place.
      function deleteBlock(blockId, withChain) {
        const block = checkedBlock(blockId);
        if (!block) return;
        Blockly.Events.setGroup(true);
        try {
          block.dispose(!withChain, true);
        } finally {
          Blockly.Events.setGroup(false);
        }
        emitState();
      }

      function emitState(requestId) {
        try {
          const state = Blockly.serialization.workspaces.save(workspace);
          const code = pythonGenerator.workspaceToCode(workspace);
          const requirements = [
            ...new Set(
              workspace
                .getAllBlocks(false)
                .map((block) => libraryBlockPackages.get(block.type))
                .filter((value) => value),
            ),
          ].sort();
          const variables = workspace
            .getVariableMap()
            .getAllVariables()
            .map((variable) => ({
              name: variable.getName(),
              type: variable.getType() || "Number",
            }))
            .filter(
              (variable) =>
                typeof variable.name === "string" &&
                variable.name.length > 0 &&
                ["Number", "String", "Boolean"].includes(variable.type),
            )
            .sort((left, right) => left.name.localeCompare(right.name));
          post({
            type: "state",
            workspace: JSON.stringify(state),
            python: code,
            requirements,
            variables,
            usesConsoleInput: workspace.getAllBlocks(false).some(
              (block) => block.type === "microarca_console_input",
            ),
            requestId,
          });
        } catch (error) {
          post({ type: "error", message: String(error) });
        }
      }

      function makeBlock(type) {
        const block = workspace.newBlock(type);
        block.initSvg();
        block.render();
        return block;
      }

      function attachShadow(parent, inputName, type, fields = {}) {
        const connection = parent.getInput(inputName)?.connection;
        if (!connection || connection.targetConnection) return;
        const shadow = makeBlock(type);
        shadow.setShadow(true);
        for (const [name, value] of Object.entries(fields)) {
          shadow.setFieldValue(String(value), name);
        }
        connection.connect(shadow.outputConnection);
      }

      function attachVariableShadow(block, inputName, variableType) {
        if (variableType === "String") {
          attachShadow(block, inputName, "text", { TEXT: "" });
        } else if (variableType === "Boolean") {
          attachShadow(block, inputName, "microarca_logic_level", {
            LEVEL: "LOW",
          });
        } else {
          attachShadow(block, inputName, "math_number", { NUM: 0 });
        }
      }

      function attachDefaultShadows(block) {
        for (const [name, value] of Object.entries(MicroArcaIO.defaults[block.type] || {})) {
          attachShadow(block, name, "math_number", { NUM: value });
        }
        switch (block.type) {
          case "microarca_pin_mode":
            attachShadow(block, "PIN", "math_number", { NUM: 2 });
            break;
          case "microarca_pin_write":
            attachShadow(block, "PIN", "math_number", { NUM: 2 });
            attachShadow(block, "LEVEL", "microarca_logic_level", {
              LEVEL: "HIGH",
            });
            break;
          case "microarca_wait":
            attachShadow(block, "SECONDS", "math_number", { NUM: 1 });
            break;
          case "microarca_while":
            attachShadow(block, "BOOL", "microarca_logic_level", {
              LEVEL: "LOW",
            });
            break;
          case "math_arithmetic":
          case "logic_compare":
            attachShadow(block, "A", "math_number", { NUM: 0 });
            attachShadow(block, "B", "math_number", { NUM: 0 });
            break;
          case "text_print":
            attachShadow(block, "TEXT", "text", { TEXT: "Olá!" });
            break;
          case "microarca_console_input":
            attachShadow(block, "PROMPT", "text", { TEXT: "Digite: " });
            break;
          case "microarca_text_join":
            attachShadow(block, "A", "text", { TEXT: "texto" });
            attachShadow(block, "B", "text", { TEXT: "valor" });
            break;
          case "controls_if":
          case "controls_ifelse":
            attachShadow(block, "IF0", "microarca_logic_level", {
              LEVEL: "HIGH",
            });
            break;
          case "logic_operation":
            attachShadow(block, "A", "microarca_logic_level", {
              LEVEL: "HIGH",
            });
            attachShadow(block, "B", "microarca_logic_level", {
              LEVEL: "HIGH",
            });
            break;
          case "logic_negate":
            attachShadow(block, "BOOL", "microarca_logic_level", {
              LEVEL: "HIGH",
            });
            break;
          case "microarca_variable_change":
            attachShadow(block, "DELTA", "math_number", { NUM: 1 });
            break;
          default: {
            const definition = libraryBlockDefinitions.get(block.type);
            if (!definition) break;
            for (const field of definition.fields) {
              if (field.type === "dropdown") {
                block.setFieldValue(field.default, field.name);
              } else if (field.type === "integer") {
                attachShadow(block, field.name, "math_number", {
                  NUM: field.default,
                });
              } else if (field.type === "text") {
                attachShadow(block, field.name, "text", {
                  TEXT: field.default,
                });
              } else if (field.type === "value") {
                if (typeof field.default === "number") {
                  attachShadow(block, field.name, "math_number", {
                    NUM: field.default,
                  });
                } else if (typeof field.default === "boolean") {
                  attachShadow(block, field.name, "microarca_logic_level", {
                    LEVEL: field.default ? "HIGH" : "LOW",
                  });
                } else {
                  attachShadow(block, field.name, "text", {
                    TEXT: field.default,
                  });
                }
              }
            }
          }
        }
      }

      function positionNewBlock(block) {
        const offset = workspace.getTopBlocks(false).length * 24;
        block.moveBy(40 + offset, 90 + offset);
        block.select();
        workspace.centerOnBlock(block.id);
      }

      function createDefault() {
        let pinMode = null;
        Blockly.Events.disable();
        try {
          workspace.clear();
          const forever = makeBlock("microarca_forever");
          pinMode = makeBlock("microarca_pin_mode");
          const pinHigh = makeBlock("microarca_pin_write");
          const waitOn = makeBlock("microarca_wait");
          const pinLow = makeBlock("microarca_pin_write");
          const waitOff = makeBlock("microarca_wait");

          pinMode.setFieldValue("OUT", "MODE");
          for (const block of [pinMode, pinHigh, waitOn, pinLow, waitOff]) {
            attachDefaultShadows(block);
          }
          pinLow
            .getInputTargetBlock("LEVEL")
            ?.setFieldValue("LOW", "LEVEL");

          pinMode.nextConnection.connect(forever.previousConnection);
          forever.getInput("DO").connection.connect(pinHigh.previousConnection);
          pinHigh.nextConnection.connect(waitOn.previousConnection);
          waitOn.nextConnection.connect(pinLow.previousConnection);
          pinLow.nextConnection.connect(waitOff.previousConnection);
          pinMode.moveBy(24, 24);
        } finally {
          Blockly.Events.enable();
        }
        Blockly.svgResize(workspace);
        if (pinMode) workspace.centerOnBlock(pinMode.id);
        emitState();
      }

      function addBlock(type) {
        if (!coreBlockTypes.has(type) && !libraryBlockPackages.has(type)) {
          post({ type: "error", message: "Tipo de bloco desconhecido." });
          return;
        }
        const block = makeBlock(type);
        attachDefaultShadows(block);
        positionNewBlock(block);
        emitState();
      }

      function addVariableBlock(type, rawName, rawVariableType) {
        if (!variableBlockTypes.has(type)) {
          post({
            type: "error",
            message: `Tipo de bloco de variável desconhecido: ${type}.`,
          });
          return;
        }
        const name = String(rawName || "").trim();
        if (!/^[A-Za-z_][A-Za-z0-9_]{0,31}$/.test(name)) {
          post({ type: "error", message: "Nome de variável inválido." });
          return;
        }
        const requestedType = String(rawVariableType || "");
        const variableType =
          type === "microarca_variable_change" ? "Number" : requestedType;
        if (!["Number", "String", "Boolean"].includes(variableType)) {
          post({ type: "error", message: "Tipo de variável inválido." });
          return;
        }
        const variableMap = workspace.getVariableMap();
        const sameName = variableMap
          .getAllVariables()
          .find((candidate) => candidate.getName() === name);
        if (sameName && sameName.getType() !== variableType) {
          post({
            type: "error",
            message: `A variável ${name} já existe com outro tipo.`,
          });
          return;
        }
        const variable =
          sameName || variableMap.createVariable(name, variableType);
        const retainedVariableIds = new Set(
          variableMap.getAllVariables().map((item) => item.getId()),
        );
        const block = makeBlock(type);
        block.setFieldValue(variable.getId(), "VAR");
        for (const candidate of variableMap.getAllVariables()) {
          if (!retainedVariableIds.has(candidate.getId())) {
            variableMap.deleteVariable(candidate);
          }
        }
        if (type === "variables_set_dynamic") {
          block.getInput("VALUE")?.setCheck(variableType);
          attachVariableShadow(block, "VALUE", variableType);
        } else if (type === "variables_get_dynamic") {
          block.outputConnection?.setCheck(variableType);
        } else {
          attachDefaultShadows(block);
        }
        positionNewBlock(block);
        emitState();
      }

      function undo() {
        workspace.undo(false);
      }

      function redo() {
        workspace.undo(true);
      }

      function deleteSelected() {
        const selected = Blockly.getSelected();
        if (selected && selected.workspace === workspace) {
          selected.dispose(true, true);
          emitState();
        }
      }

      function migrateFieldToShadow(
        blockState,
        fieldName,
        shadowType,
        shadowField,
        fallback,
      ) {
        const rawValue = blockState.fields?.[fieldName] ?? fallback;
        blockState.inputs ||= {};
        blockState.inputs[fieldName] ||= {
          shadow: {
            type: shadowType,
            fields: { [shadowField]: rawValue },
          },
        };
        if (blockState.fields) delete blockState.fields[fieldName];
      }

      function visitBlockStates(value, visitor) {
        if (!value || typeof value !== "object") return;
        if (typeof value.type === "string") visitor(value);
        for (const child of Object.values(value)) {
          visitBlockStates(child, visitor);
        }
      }

      function migrateLegacyWorkspaceState(state) {
        if (Array.isArray(state?.variables)) {
          for (const variable of state.variables) {
            if (
              variable &&
              typeof variable === "object" &&
              !["Number", "String", "Boolean"].includes(variable.type)
            ) {
              variable.type = "Number";
            }
          }
        }
        visitBlockStates(state?.blocks, (blockState) => {
          if (blockState.type === "variables_set") {
            blockState.type = "variables_set_dynamic";
          } else if (blockState.type === "variables_get") {
            blockState.type = "variables_get_dynamic";
          } else if (blockState.type === "math_change") {
            blockState.type = "microarca_variable_change";
          }

          if (blockState.type === "microarca_pin_mode") {
            migrateFieldToShadow(
              blockState,
              "PIN",
              "math_number",
              "NUM",
              2,
            );
          } else if (blockState.type === "microarca_pin_write") {
            migrateFieldToShadow(
              blockState,
              "PIN",
              "math_number",
              "NUM",
              2,
            );
            migrateFieldToShadow(
              blockState,
              "LEVEL",
              "microarca_logic_level",
              "LEVEL",
              "LOW",
            );
          } else if (blockState.type === "microarca_wait") {
            migrateFieldToShadow(
              blockState,
              "SECONDS",
              "math_number",
              "NUM",
              1,
            );
          }

          const definition = libraryBlockDefinitions.get(blockState.type);
          if (!definition) return;
          for (const field of definition.fields) {
            if (field.type === "integer") {
              migrateFieldToShadow(
                blockState,
                field.name,
                "math_number",
                "NUM",
                field.default,
              );
            } else if (field.type === "text") {
              migrateFieldToShadow(
                blockState,
                field.name,
                "text",
                "TEXT",
                field.default,
              );
            }
          }
        });
        return state;
      }

      function loadWorkspace(encoded) {
        try {
          const state = migrateLegacyWorkspaceState(JSON.parse(encoded));
          Blockly.Events.disable();
          try {
            workspace.clear();
            Blockly.serialization.workspaces.load(state, workspace);
          } finally {
            Blockly.Events.enable();
          }
          Blockly.svgResize(workspace);
          const roots = workspace.getTopBlocks(true);
          if (roots.length) workspace.centerOnBlock(roots[0].id);
          emitState();
        } catch (error) {
          post({ type: "error", message: `Projeto inválido: ${error}` });
        }
      }

      let changeTimer = null;
      workspace.addChangeListener((event) => {
        handleBlockDrag(event);
        if (event && event.isUiEvent) return;
        window.clearTimeout(changeTimer);
        changeTimer = window.setTimeout(emitState, 120);
      });

      window.addEventListener("resize", () => Blockly.svgResize(workspace));
      window.microArca = {
        setLoupeEnabled,
        setDarkMode,
        registerLibraryManifests,
        createDefault,
        loadWorkspace,
        addBlock,
        addVariableBlock,
        copyBlock,
        pasteBlock,
        deleteBlock,
        duplicateBlock,
        setBlockDisabled,
        resolvePrompt,
        undo,
        redo,
        deleteSelected,
        emitState,
      };
      post({ type: "ready" });
    </script>
  </body>
</html>
